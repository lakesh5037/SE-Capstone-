server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── Serve static files (logo, fonts, js, css, icons) ──────────────────────
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|js|css|map|tflite)$ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # ── All other routes → React SPA (handles /dashboard, /login, etc) ────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
