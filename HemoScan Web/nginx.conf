server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── Never cache index.html — browser always gets the latest build ──────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # ── Serve hashed Vite assets (logo, js, css, fonts, tflite) ───────────────
    # Vite hashes filenames on every build so long cache is safe here
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Other static files (favicon, manifest, robots) ────────────────────────
    location ~* \.(ico|txt|xml|json|webmanifest)$ {
        try_files $uri =404;
        expires 1d;
    }

    # ── React SPA fallback — all routes return index.html ─────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
