server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── Never cache index.html so browser always loads latest build ────────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # ── Serve static files (logo, fonts, js, css, icons) ──────────────────────
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|js|css|map|tflite)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # ── All other routes → React SPA (handles /dashboard, /login, etc) ────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
